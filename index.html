<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 4 Me Français</title>
<meta name="theme-color" content="#1f4e8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Class 4 Me FR">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: una colonna da telefono, intestazione con il conto alla rovescia, navigazione fissa in basso */
  --bg:#f2f4f7; --surface:#ffffff; --ink:#18212e; --muted:#5b6676; --line:#d9dee6;
  --accent:#1f4e8c; --accent-ink:#ffffff; --accent-soft:#e3ebf6; --rouge:#b8322b; --rouge-soft:#f7e3e1;
  --good:#1d7a4a; --good-soft:#e1f2e8; --warn:#a86207; --warn-soft:#fbefdc;
  --masc:#2563b0; --fem:#b8322b;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --surface:#18202b; --ink:#e8edf4; --muted:#9aa6b6; --line:#2b3644;
    --accent:#7aa7e6; --accent-ink:#0b1420; --accent-soft:#1c2c42; --rouge:#ef8a82; --rouge-soft:#3a1f1d;
    --good:#6fd29c; --good-soft:#173326; --warn:#f0b35c; --warn-soft:#3a2b14;
    --masc:#7aa7e6; --fem:#ef8a82; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#18202b; --ink:#e8edf4; --muted:#9aa6b6; --line:#2b3644;
  --accent:#7aa7e6; --accent-ink:#0b1420; --accent-soft:#1c2c42; --rouge:#ef8a82; --rouge-soft:#3a1f1d;
  --good:#6fd29c; --good-soft:#173326; --warn:#f0b35c; --warn-soft:#3a2b14;
  --masc:#7aa7e6; --fem:#ef8a82; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:6px}
.brand small{font-family:var(--body);font-weight:700;font-size:12px;color:var(--rouge);text-transform:uppercase;letter-spacing:.08em}
.countdown{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.countdown b{color:var(--ink);font-size:16px}
main{flex:1;padding:16px 16px 110px;display:flex;flex-direction:column;gap:14px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav.bottom .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.bottom button{background:none;border:0;color:var(--muted);font:inherit;font-size:11px;padding:6px 1px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px;cursor:pointer}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button.on{color:var(--accent);font-weight:700}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:26px;font-weight:800}
h2{font-size:20px;font-weight:600}
h3{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.card.accent{border-left:5px solid var(--accent)}
.card.done{opacity:.72}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.btn,a.btn,label.btn{font:inherit;font-weight:700;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:12px 16px;cursor:pointer;min-height:48px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.btn.ghost{background:transparent;color:var(--accent)}
button.btn.soft,label.btn.soft{background:var(--accent-soft);color:var(--accent);border-color:transparent}
button.btn.red{background:var(--rouge);border-color:var(--rouge);color:#fff}
button.btn.small,label.btn.small{min-height:38px;padding:7px 12px;font-size:15px}
button.btn.wide{width:100%}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.red{background:var(--rouge-soft);color:var(--rouge)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.toggle{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 14px;cursor:pointer}
.toggle.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
label{font-weight:700;font-size:15px}
input[type=text],input[type=date],input[type=number],textarea,select{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
.opt{font:inherit;text-align:left;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:700}
.opt.wrong{border-color:var(--rouge);background:var(--rouge-soft);color:var(--rouge)}
.line{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.who{font-weight:700;color:var(--accent);min-width:22px}
.who.b{color:var(--rouge)}
.fr{font-size:18px}
.it{font-size:14px;color:var(--muted)}
.play{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.play svg{width:18px;height:18px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.big{font-family:var(--display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.flash{font-family:var(--display);font-size:30px;font-weight:600;text-align:center;padding:18px 6px}
.m{color:var(--masc)} .f{color:var(--fem)}
.diff ins{background:var(--good-soft);color:var(--good);text-decoration:none;padding:0 3px;border-radius:4px}
.diff del{background:var(--rouge-soft);color:var(--rouge);padding:0 3px;border-radius:4px}
.bubble{padding:10px 12px;border-radius:14px;max-width:88%}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.bubble.ai{align-self:flex-start;background:var(--accent-soft);color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:8px}
.note{font-size:14px;background:var(--warn-soft);color:var(--ink);padding:10px 12px;border-radius:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.kbd{font-size:13px;color:var(--muted)}
.score{font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-size:13px}
.copybox{width:100%;min-height:140px;font-size:13px}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion: no-preference){ .card{transition:opacity .2s} }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Class 4 Me <small>Français</small></div>
    <div class="countdown" id="countdown"></div>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav class="bottom" aria-label="Sezioni">
    <div class="in" id="nav"></div>
  </nav>
</div>
<script>
"use strict";
/* ============================ DATI ============================ */
const LEVELS=["A1","A2","B1","B2"];
const CONTEXTS={
  amici:"Amici e parenti", bambini:"Parlare con i bambini", viaggio:"Sconosciuti e viaggio",
  casa:"Casa e servizi", scuola:"Scuola", lavoro:"Riunioni e lavoro", cantiere:"Cantiere e sopralluoghi", colloquio:"Colloquio di lavoro"
};
const DIALOGS=[
 {id:"cafe",lvl:"A1",ctx:"viaggio",title:"Au café",lines:[
  ["A","Bonjour ! Qu'est-ce que je vous sers ?","Buongiorno! Cosa le porto?"],
  ["B","Bonjour. Un café crème et un croissant, s'il vous plaît.","Buongiorno. Un caffè crème e un croissant, per favore."],
  ["A","Sur place ou à emporter ?","Qui o da portare via?"],
  ["B","Sur place. C'est combien ?","Qui. Quanto costa?"],
  ["A","Ça fait cinq euros vingt.","Fanno cinque euro e venti."],
  ["B","Voilà. Merci, bonne journée !","Ecco. Grazie, buona giornata!"]],
  q:[["Cosa ordina il cliente?",["Un caffè crème e un croissant","Un tè e un croissant","Un caffè e un pain au chocolat"],0],
     ["Quanto paga?",["5,20 €","2,50 €","5,02 €"],0],
     ["Dove consuma?",["Al bar, sul posto","Lo porta via","Non si capisce"],0]]},
 {id:"chemin",lvl:"A1",ctx:"viaggio",title:"Demander son chemin",lines:[
  ["A","Pardon madame, la station de métro, s'il vous plaît ?","Mi scusi signora, la stazione della metro, per favore?"],
  ["B","C'est tout près. Vous allez tout droit, puis vous tournez à gauche au feu.","È vicinissima. Va dritto, poi gira a sinistra al semaforo."],
  ["A","À gauche au feu... C'est loin ?","A sinistra al semaforo... È lontano?"],
  ["B","Non, cinq minutes à pied.","No, cinque minuti a piedi."],
  ["A","Merci beaucoup !","Grazie mille!"],
  ["B","De rien, bonne journée.","Di niente, buona giornata."]],
  q:[["Dove deve girare?",["A sinistra al semaforo","A destra al semaforo","A sinistra dopo il ponte"],0],
     ["Quanto dista?",["Cinque minuti a piedi","Quindici minuti a piedi","Cinque minuti in autobus"],0]]},
 {id:"weekend",lvl:"A1",ctx:"amici",title:"Le week-end",lines:[
  ["A","Salut Marc ! Tu as passé un bon week-end ?","Ciao Marc! Hai passato un buon fine settimana?"],
  ["B","Oui, super. Samedi, je suis allé à la mer avec ma femme et mon fils.","Sì, benissimo. Sabato sono andato al mare con mia moglie e mio figlio."],
  ["A","Il a fait beau ?","Ha fatto bel tempo?"],
  ["B","Oui, il a fait très chaud. Et toi, qu'est-ce que tu as fait ?","Sì, ha fatto molto caldo. E tu, cosa hai fatto?"],
  ["A","Rien de spécial. Je suis restée à la maison, j'ai regardé un film.","Niente di speciale. Sono rimasta a casa, ho guardato un film."]],
  q:[["Dove è andato Marc sabato?",["Al mare","In montagna","Al cinema"],0],
     ["Con chi?",["Con la moglie e il figlio","Con degli amici","Da solo"],0],
     ["Cosa ha fatto l'amica?",["È rimasta a casa e ha visto un film","È andata al mare","Ha lavorato"],0]]},
 {id:"hotel",lvl:"A2",ctx:"viaggio",title:"À l'hôtel",lines:[
  ["A","Bonsoir monsieur, vous avez une réservation ?","Buonasera signore, ha una prenotazione?"],
  ["B","Oui, au nom de Grimaudo, pour trois nuits.","Sì, a nome Grimaudo, per tre notti."],
  ["A","Parfait. Vous avez la chambre deux cent quatorze, au deuxième étage.","Perfetto. Ha la camera 214, al secondo piano."],
  ["B","Excusez-moi, est-ce qu'il y a une chambre plus calme ? Je travaille tôt demain.","Mi scusi, c'è una camera più tranquilla? Domani lavoro presto."],
  ["A","Je vais regarder... J'ai une chambre côté cour, mais elle est un peu plus petite.","Controllo... Ho una camera sul cortile, ma è un po' più piccola."],
  ["B","Ce n'est pas grave, je la prends.","Non importa, la prendo."],
  ["A","Le petit-déjeuner est servi de sept heures à dix heures.","La colazione è servita dalle sette alle dieci."]],
  q:[["Per quante notti ha prenotato?",["Tre","Due","Quattro"],0],
     ["Perché chiede un'altra camera?",["Vuole una camera più tranquilla","Vuole una camera più grande","Vuole la vista sul mare"],0],
     ["Orario della colazione?",["7-10","6-9","8-11"],0]]},
 {id:"cache",lvl:"A2",ctx:"bambini",title:"Expliquer un jeu",lines:[
  ["A","Bon, on joue à cache-cache ? Toi, tu fermes les yeux et tu comptes jusqu'à vingt.","Allora, giochiamo a nascondino? Tu chiudi gli occhi e conti fino a venti."],
  ["B","Et toi, tu te caches ?","E tu ti nascondi?"],
  ["A","Oui, moi et ta cousine, on se cache. Après, tu dois nous trouver.","Sì, io e tua cugina ci nascondiamo. Dopo devi trovarci."],
  ["B","Et si je ne vous trouve pas ?","E se non vi trovo?"],
  ["A","Alors tu dis : je donne ma langue au chat ! Et on sort.","Allora dici: mi arrendo! E usciamo."]],
  q:[["Fino a quanto deve contare il bambino?",["Venti","Dieci","Trenta"],0],
     ["Cosa significa «je donne ma langue au chat»?",["Mi arrendo","Ho fame","Ho trovato tutti"],0]]},
 {id:"appart",lvl:"A2",ctx:"casa",title:"Visiter un appartement",lines:[
  ["A","Voici le salon. Il fait vingt-huit mètres carrés et il y a deux grandes fenêtres.","Ecco il soggiorno. Misura ventotto metri quadrati e ha due grandi finestre."],
  ["B","C'est lumineux. Le chauffage, c'est électrique ou au gaz ?","È luminoso. Il riscaldamento è elettrico o a gas?"],
  ["A","Électrique. Et le chauffage est compris dans le loyer.","Elettrico. E il riscaldamento è compreso nell'affitto."],
  ["B","Et le loyer, c'est combien par mois ?","E l'affitto quanto è al mese?"],
  ["A","Mille six cent cinquante dollars. L'appartement est libre à partir du premier juillet.","Milleseicentocinquanta dollari. L'appartamento è libero dal primo luglio."],
  ["B","Est-ce qu'on peut avoir un animal ?","Si possono tenere animali?"],
  ["A","Un petit chien, oui, mais pas de chat.","Un cagnolino sì, ma niente gatti."]],
  q:[["Quanto misura il soggiorno?",["28 m²","18 m²","38 m²"],0],
     ["Quanto costa l'affitto?",["1650 dollari al mese","1560 dollari al mese","650 dollari al mese"],0],
     ["Da quando è libero?",["Dal 1° luglio","Dal 1° giugno","Subito"],0],
     ["Animali?",["Un cane piccolo sì, gatti no","Nessun animale","Solo gatti"],0]]},
 {id:"ecole",lvl:"B1",ctx:"scuola",title:"Rencontre avec l'enseignante",lines:[
  ["A","Bonjour, merci d'être venu. Votre fils s'est très bien intégré dans la classe.","Buongiorno, grazie di essere venuto. Suo figlio si è integrato molto bene nella classe."],
  ["B","Ça me rassure. À la maison, il dit qu'il a parfois du mal à suivre en français.","Mi rassicura. A casa dice che a volte fa fatica a seguire in francese."],
  ["A","C'est normal au début. Je lui ai proposé des séances d'aide aux devoirs le mardi après les cours.","All'inizio è normale. Gli ho proposto delle sessioni di aiuto compiti il martedì dopo le lezioni."],
  ["B","Très bien. Est-ce qu'on peut faire quelque chose à la maison ?","Molto bene. Possiamo fare qualcosa a casa?"],
  ["A","Lisez avec lui dix minutes par jour, même des bandes dessinées. Et s'il regarde des dessins animés, qu'il les regarde en français.","Leggete con lui dieci minuti al giorno, anche fumetti. E se guarda i cartoni, che li guardi in francese."]],
  q:[["Come si è inserito il figlio?",["Molto bene","Con molte difficoltà","Non si sa ancora"],0],
     ["Quando c'è l'aiuto compiti?",["Il martedì dopo le lezioni","Il lunedì mattina","Il sabato"],0],
     ["Cosa consiglia l'insegnante?",["Leggere insieme 10 minuti al giorno","Cambiare classe","Fare lezioni private"],0]]},
 {id:"chantier",lvl:"B1",ctx:"cantiere",title:"Sur le chantier",lines:[
  ["A","Bonjour, je suis l'architecte. Je viens pour la visite de chantier.","Buongiorno, sono l'architetto. Vengo per il sopralluogo."],
  ["B","Bonjour. On a un problème au sous-sol : il y a des traces d'humidité sur le mur nord.","Buongiorno. Abbiamo un problema nel seminterrato: ci sono tracce di umidità sul muro nord."],
  ["A","Depuis quand ?","Da quando?"],
  ["B","On les a remarquées lundi, après les fortes pluies.","Le abbiamo notate lunedì, dopo le forti piogge."],
  ["A","D'accord. Je vais prendre des mesures avec l'humidimètre et faire quelques photos thermiques. En attendant, ne posez pas le revêtement sur ce mur.","D'accordo. Prendo delle misure con l'igrometro e faccio qualche foto termica. Nel frattempo non posate il rivestimento su questo muro."],
  ["B","Entendu. On attend votre rapport avant de continuer.","Intesi. Aspettiamo la sua relazione prima di continuare."]],
  q:[["Dov'è il problema?",["Nel seminterrato, muro nord","In copertura","Nel muro sud del soggiorno"],0],
     ["Quando l'hanno notato?",["Lunedì, dopo le piogge","Venerdì scorso","Stamattina"],0],
     ["Cosa chiede l'architetto?",["Di non posare il rivestimento su quel muro","Di demolire il muro","Di chiamare un idraulico"],0]]},
 {id:"reunion",lvl:"B1",ctx:"lavoro",title:"Réunion de projet",lines:[
  ["A","Où en est le dossier de rénovation énergétique ?","A che punto è la pratica di riqualificazione energetica?"],
  ["B","L'audit est terminé. Nous avons identifié trois interventions prioritaires : l'isolation de la toiture, le remplacement des fenêtres et une pompe à chaleur.","La diagnosi è conclusa. Abbiamo individuato tre interventi prioritari: isolamento della copertura, sostituzione delle finestre e una pompa di calore."],
  ["A","Et les délais ?","E i tempi?"],
  ["B","Si le client valide la semaine prochaine, les travaux pourraient commencer en mars et se terminer fin mai.","Se il cliente approva la settimana prossima, i lavori potrebbero iniziare a marzo e finire a fine maggio."],
  ["A","Il faudrait aussi une estimation des économies d'énergie.","Servirebbe anche una stima del risparmio energetico."],
  ["B","Je vous l'envoie d'ici vendredi.","Gliela mando entro venerdì."]],
  q:[["Quanti interventi prioritari?",["Tre","Due","Quattro"],0],
     ["Quando potrebbero iniziare i lavori?",["A marzo","A maggio","La settimana prossima"],0],
     ["Cosa invierà entro venerdì?",["La stima dei risparmi energetici","Il preventivo dell'impresa","Il contratto"],0]]},
 {id:"entretien",lvl:"B1",ctx:"colloquio",title:"Entretien d'embauche",lines:[
  ["A","Parlez-moi de votre parcours.","Mi parli del suo percorso."],
  ["B","Je suis architecte depuis deux mille huit. Je me suis spécialisé dans l'efficacité énergétique et le diagnostic des bâtiments.","Sono architetto dal 2008. Mi sono specializzato in efficienza energetica e diagnostica degli edifici."],
  ["A","Pourquoi voulez-vous travailler chez nous ?","Perché vuole lavorare da noi?"],
  ["B","Vous réalisez des projets de rénovation durable, et c'est exactement ce que je fais depuis quinze ans.","Realizzate progetti di riqualificazione sostenibile, ed è esattamente quello che faccio da quindici anni."],
  ["A","Vous êtes à l'aise en français ?","Si trova a suo agio in francese?"],
  ["B","Je me débrouille, et je suis des cours pour atteindre le niveau B2.","Me la cavo, e seguo dei corsi per arrivare al livello B2."]],
  q:[["In cosa si è specializzato?",["Efficienza energetica e diagnostica","Restauro di monumenti","Interior design"],0],
     ["Cosa vuol dire «je me débrouille»?",["Me la cavo","Mi confondo","Mi annoio"],0]]},
 {id:"teletravail",lvl:"B2",ctx:"lavoro",title:"Le télétravail (radio)",lines:[
  ["A","Le télétravail s'est installé durablement dans nos habitudes. Pour certains, il améliore la qualité de vie : moins de déplacements, plus de concentration.","Il telelavoro è entrato stabilmente nelle nostre abitudini. Per alcuni migliora la qualità della vita: meno spostamenti, più concentrazione."],
  ["A","Pour d'autres, il fragilise le lien social et brouille la frontière entre vie privée et vie professionnelle.","Per altri indebolisce il legame sociale e confonde il confine tra vita privata e vita professionale."],
  ["A","Selon une enquête récente, une majorité de salariés souhaiteraient conserver deux ou trois jours à domicile par semaine.","Secondo un'indagine recente, la maggioranza dei dipendenti vorrebbe mantenere due o tre giorni a casa alla settimana."],
  ["A","Reste à savoir si les entreprises sauront s'adapter sans perdre leur cohésion.","Resta da vedere se le aziende sapranno adattarsi senza perdere coesione."]],

  ex:[["Je voudrais du pain et de la confiture.","Vorrei del pane e della marmellata."],["Il n'y a plus de lait.","Non c'è più latte."],["Un kilo de tomates, s'il vous plaît.","Un chilo di pomodori, per favore."],["Des enfants ? J'en ai un.","Figli? Ne ho uno."]],
  trap:"In italiano spesso non si mette nulla (compro pane); in francese l'articolo è obbligatorio: j'achète du pain.",
  quiz:[["Je prends ___ eau minérale.",["de l'","du","de la"]],["Nous n'avons pas ___ voiture.",["de","une","la"]],["Il y a beaucoup ___ travail.",["de","du","des"]],["Tu veux du café ? Oui, j'___ veux bien.",["en","le","y"]],["Elle achète ___ légumes au marché.",["des","de","les"]]],
  acts:[{t:"suono",id:"liaison",l:"Pronuncia: liaison"},{t:"dialogo",lvl:"A1",l:"Ascolto: al bar"},{t:"parla",ctx:"viaggio",l:"Conversazione: al ristorante"},{t:"parole",l:"Ripasso parole"}]},

 {id:"u6",ph:"p2",lvl:"A2",title:"Décrire",can:"Descrivere persone, luoghi e case; fare confronti.",
  gram:"accordo e posizione degli aggettivi · comparativo · meilleur e mieux",
  spiega:"L'aggettivo si accorda: grand, grande, grands, grandes. Di solito va dopo il nome (une maison moderne), ma alcuni brevi e frequenti vanno prima: beau, bon, grand, petit, jeune, vieux, nouveau, joli. Comparativo: plus, moins, aussi + aggettivo + que; bon diventa meilleur, bien diventa mieux.",
  ex:[["C'est une belle maison ancienne.","È una bella casa antica."],["Cet appartement est plus lumineux que l'autre.","Questo appartamento è più luminoso dell'altro."],["Ce quartier est aussi calme que le nôtre.","Questo quartiere è tranquillo quanto il nostro."],["Ce restaurant est meilleur.","Questo ristorante è migliore."]],
  trap:"Beau, nouveau, vieux davanti a vocale diventano bel, nouvel, vieil: un bel appartement, un vieil immeuble.",
  quiz:[["C'est une ___ idée.",["bonne","bon","bien"]],["Un ___ appartement.",["bel","beau","belle"]],["Ce vin est ___ que l'autre.",["meilleur","plus bon","mieux"]],["Elle parle ___ que moi.",["mieux","meilleur","plus bien"]],["Des maisons ___.",["modernes","moderne","modernas"]]],
  acts:[{t:"dialogo",lvl:"A2",l:"Ascolto: visitare un appartamento"},{t:"parla",ctx:"casa",l:"Conversazione: casa"},{t:"parole",l:"Ripasso parole"}]},
 {id:"u7",ph:"p2",lvl:"A2",title:"Souvenirs",can:"Raccontare ricordi e abitudini del passato.",
  gram:"imparfait · imparfait e passé composé insieme",
  spiega:"L'imparfait descrive sfondo, abitudini e stati nel passato; il passé composé racconta l'azione puntuale che fa avanzare la storia. Si forma dalla radice di nous al presente + -ais, -ais, -ait, -ions, -iez, -aient (unica eccezione: être, j'étais).",
  ex:[["Quand j'étais enfant, nous allions à la mer chaque été.","Da bambino andavamo al mare ogni estate."],["Il pleuvait quand je suis arrivé.","Pioveva quando sono arrivato."],["Avant, je travaillais à Rome.","Prima lavoravo a Roma."],["Je regardais la télé quand le téléphone a sonné.","Guardavo la tv quando ha suonato il telefono."]],
  trap:"L'uso è come in italiano (imperfetto e passato prossimo): la difficoltà è nelle forme, non nella scelta.",
  quiz:[["Quand j'étais petit, je ___ au football.",["jouais","ai joué","jouerai"]],["Il ___ beau quand nous sommes sortis.",["faisait","a fait","fait"]],["Nous ___ quand il est arrivé.",["dînions","avons dîné","dînons"]],["Hier soir, j'___ un film.",["ai vu","voyais","vois"]],["Avant, ils ___ à Lyon.",["habitaient","ont habité","habitent"]]],
  acts:[{t:"verbi",ten:["imp","pc"],l:"Imparfait e passé composé"},{t:"dialogo",lvl:"A2",l:"Ascolto A2"},{t:"scrivi",w:{id:"pw7",lvl:"A2",words:100,focus:"passato",text:"Racontez un souvenir d'enfance : où vous étiez, ce que vous faisiez, ce qui s'est passé (100 mots).",it:"Racconta un ricordo d'infanzia."},l:"Scrivi un ricordo"}]},
 {id:"u8",ph:"p2",lvl:"A2",title:"Projets",can:"Parlare di progetti e previsioni.",
  gram:"futur simple · radici irregolari · quand + futuro",
  spiega:"Il futur simple si forma con l'infinito + -ai, -as, -a, -ons, -ez, -ont (je parlerai, je finirai); i verbi in -re perdono la e (je prendrai). Radici irregolari: ser- (être), aur- (avoir), ir- (aller), fer- (faire), viendr- (venir), pourr- (pouvoir), voudr- (vouloir), devr- (devoir), saur- (savoir), verr- (voir), enverr- (envoyer).",
  ex:[["Nous déménagerons l'été prochain.","Traslocheremo la prossima estate."],["Quand j'aurai le temps, je t'appellerai.","Quando avrò tempo ti chiamerò."],["Le chantier commencera en mars.","Il cantiere comincerà a marzo."],["Tu verras, ce sera facile.","Vedrai, sarà facile."]],
  trap:"Dopo quand si usa il futuro anche nella subordinata: quand je serai en France (non «quand je suis»).",
  quiz:[["Demain, il ___ beau.",["fera","faira","fait"]],["Nous ___ en juillet.",["partirons","partons","partions"]],["Quand tu ___ à Paris, appelle-moi.",["seras","es","étais"]],["Je ___ le rapport vendredi.",["enverrai","envoierai","envoyais"]],["Ils ___ venir ?",["pourront","pouveront","peuvront"]]],
  acts:[{t:"verbi",ten:["fut"],l:"Futur simple"},{t:"dialogo",lvl:"B1",l:"Ascolto: riunione di progetto"},{t:"scrivi",w:{id:"pw8",lvl:"A2",words:100,focus:"futuro",text:"Écrivez un message à un ami pour lui présenter vos projets pour l'année prochaine (100 mots).",it:"I tuoi progetti per l'anno prossimo."},l:"Scrivi i tuoi progetti"}]},
 {id:"u9",ph:"p2",lvl:"A2",title:"Les pronoms",can:"Evitare ripetizioni usando i pronomi.",
  gram:"le, la, les · lui, leur · y · en · posizione con il passé composé",
  spiega:"Il pronome va prima del verbo: je le vois, je lui parle. Oggetto diretto: me, te, le, la, nous, vous, les. Oggetto indiretto (à + persona): me, te, lui, nous, vous, leur. Y sostituisce un luogo o à + cosa (j'y vais, j'y pense); en sostituisce de + cosa o una quantità. Al passé composé il pronome va prima dell'ausiliare: je l'ai vu.",
  ex:[["Tu connais Marc ? Oui, je le connais bien.","Conosci Marc? Sì, lo conosco bene."],["J'ai téléphoné à mes parents : je leur ai annoncé la nouvelle.","Ho telefonato ai miei: ho dato loro la notizia."],["Tu vas au bureau ? Oui, j'y vais.","Vai in ufficio? Sì, ci vado."],["Des photos ? J'en ai pris beaucoup.","Foto? Ne ho fatte molte."]],
  trap:"Leur come pronome non prende mai la s. Lui vale sia per «gli» sia per «le».",
  quiz:[["Ce film, je l'___ vu hier.",["ai","lui","le"]],["Je parle à Sophie : je ___ parle.",["lui","la","leur"]],["Mes collègues ? Je ___ ai écrit un mail.",["leur","les","leurs"]],["Tu vas à la banque ? Oui, j'___ vais.",["y","en","la"]],["Du café ? Non merci, j'___ ai déjà bu.",["en","y","le"]]],
  acts:[{t:"dialogo",lvl:"A2",l:"Ascolto A2"},{t:"parla",ctx:"amici",l:"Conversazione: amici"},{t:"parole",l:"Ripasso parole"}]},
 {id:"u10",ph:"p2",lvl:"A2",title:"Demander poliment",can:"Chiedere, consigliare e dare istruzioni con il registro giusto.",
  gram:"imperativo · condizionale di cortesia · devoir e il faut",
  spiega:"L'imperativo ha tre forme (parle, parlons, parlez); i verbi in -er perdono la s alla seconda persona: écoute ! Per chiedere con cortesia si usa il condizionale: je voudrais, pourriez-vous, j'aimerais. Il faut + infinito esprime un obbligo generale; tu devrais + infinito un consiglio.",
  ex:[["Pourriez-vous m'envoyer le devis ?","Potrebbe mandarmi il preventivo?"],["Je voudrais un rendez-vous pour jeudi.","Vorrei un appuntamento per giovedì."],["Prenez la deuxième rue à droite.","Prenda la seconda strada a destra."],["Il faut réserver à l'avance.","Bisogna prenotare in anticipo."]],
  trap:"Vous è il lei di cortesia: in una mail di lavoro si usa sempre, anche se l'interlocutore è giovane.",
  quiz:[["___-moi, s'il vous plaît.",["Excusez","Excuser","Excusé"]],["Je ___ réserver une table pour deux.",["voudrais","veux que","voulais que"]],["___-vous m'aider ?",["Pourriez","Pouviez","Pourrez"]],["Il ___ arriver à l'heure.",["faut","doit","fallait que"]],["Tu ___ te reposer.",["devrais","devras que","dois que"]]],
  acts:[{t:"parla",ctx:"casa",l:"Conversazione: chiedere informazioni"},{t:"scrivi",w:{id:"pw10",lvl:"A2",words:100,focus:"mail formale",text:"Écrivez un mail formel à une agence immobilière pour demander des informations sur un appartement : loyer, charges, date de disponibilité, visite (100 mots).",it:"Mail formale a un'agenzia immobiliare."},l:"Scrivi una mail formale"},{t:"dialogo",lvl:"A2",l:"Ascolto: in albergo"}]},

 {id:"u11",ph:"p3",lvl:"B1",title:"Les relatifs",can:"Costruire frasi più lunghe e precise.",
  gram:"qui · que · où · dont",
  spiega:"Qui è soggetto (l'homme qui parle), que è complemento oggetto (le livre que je lis), où indica luogo o tempo (la ville où j'habite, le jour où il est arrivé), dont sostituisce de + nome (le projet dont je t'ai parlé, perché si dice parler de).",
  ex:[["C'est l'architecte qui a dessiné ce bâtiment.","È l'architetto che ha disegnato questo edificio."],["Le rapport que tu m'as envoyé est clair.","La relazione che mi hai mandato è chiara."],["La maison où nous habitons est ancienne.","La casa dove abitiamo è antica."],["C'est un problème dont on parle beaucoup.","È un problema di cui si parla molto."]],
  trap:"Dont va con i verbi che reggono de: parler de, avoir besoin de, être content de, se souvenir de.",
  quiz:[["Le collègue ___ travaille avec moi est canadien.",["qui","que","dont"]],["Le livre ___ je lis est passionnant.",["que","qui","dont"]],["C'est la ville ___ je suis né.",["où","que","dont"]],["Voici l'outil ___ j'ai besoin.",["dont","que","où"]],["Le jour ___ il est arrivé, il pleuvait.",["où","que","quand"]]],
  acts:[{t:"dialogo",lvl:"B1",l:"Ascolto B1"},{t:"lettura",id:"r1",l:"Lettura: avviso della scuola"},{t:"parole",l:"Ripasso parole"}]},
 {id:"u12",ph:"p3",lvl:"B1",title:"Raconter une expérience",can:"Raccontare un'esperienza ordinando i fatti nel tempo.",
  gram:"plus-que-parfait · accordo del participio passato",
  spiega:"Il plus-que-parfait indica un fatto anteriore a un altro fatto passato: imparfait di avoir o être + participio (j'avais fini, elle était partie). Con être il participio si accorda con il soggetto; con avoir si accorda con il complemento oggetto solo se questo viene prima del verbo (la lettre que j'ai écrite).",
  ex:[["Quand je suis arrivé, la réunion avait déjà commencé.","Quando sono arrivato la riunione era già cominciata."],["Elle m'a dit qu'elle avait perdu ses clés.","Mi ha detto che aveva perso le chiavi."],["Les photos que j'ai prises sont floues.","Le foto che ho fatto sono sfocate."],["Ils étaient partis avant la pluie.","Erano partiti prima della pioggia."]],
  trap:"L'accordo con avoir si vede soprattutto allo scritto: è un criterio della griglia DELF (morfosintassi).",
  quiz:[["Quand nous sommes arrivés, le film ___ commencé.",["avait","a","était"]],["Elles ___ parties tôt.",["étaient","avaient","ont"]],["Les fenêtres que nous avons ___.",["changées","changé","changés"]],["Il pensait que tu ___ déjà mangé.",["avais","as","aurais été"]],["La maison qu'ils ont ___ est magnifique.",["achetée","acheté","achetés"]]],
  acts:[{t:"verbi",ten:["pc","imp"],l:"Passato: ripasso"},{t:"dialogo",lvl:"B1",l:"Ascolto: in cantiere"},{t:"scrivi",w:{id:"pw12",lvl:"B1",words:160,focus:"racconto",text:"Racontez une expérience professionnelle difficile et ce que vous en avez appris (160 mots).",it:"Un'esperienza di lavoro difficile e cosa hai imparato."},l:"Scrivi un'esperienza"}]},
 {id:"u13",ph:"p3",lvl:"B1",title:"Le subjonctif",can:"Esprimere necessità, desiderio, sentimento e opinione.",
  gram:"congiuntivo presente · indicativo dopo je pense que",
  spiega:"Il congiuntivo si usa dopo necessità (il faut que), volontà (je veux que, je souhaite que), sentimento (je suis content que, j'ai peur que) e alcune congiunzioni (pour que, avant que, bien que). Forma: radice di ils al presente + -e, -es, -e, -ions, -iez, -ent. Irregolari: que je sois, que j'aie, que j'aille, que je fasse, que je puisse, que je sache, que je veuille.",
  ex:[["Il faut que tu viennes demain.","Bisogna che tu venga domani."],["Je veux que le rapport soit prêt lundi.","Voglio che la relazione sia pronta lunedì."],["Je suis content que vous puissiez venir.","Sono contento che possiate venire."],["Je pense qu'il a raison.","Penso che abbia ragione."]],
  trap:"Dopo je pense que, je crois que, je trouve que si usa l'indicativo, al contrario dell'italiano. Il congiuntivo torna nella forma negativa: je ne pense pas qu'il ait raison.",
  quiz:[["Il faut que nous ___ ce dossier.",["finissions","finissons","finirons"]],["Je veux que tu ___ à l'heure.",["sois","es","seras"]],["Je pense qu'il ___ raison.",["a","ait","avoir"]],["Je ne crois pas qu'il ___ venir.",["puisse","peut","pourra"]],["Bien qu'elle ___ fatiguée, elle travaille.",["soit","est","était"]]],
  acts:[{t:"parla",ctx:"lavoro",l:"Conversazione: in riunione"},{t:"dialogo",lvl:"B1",l:"Ascolto: incontro a scuola"},{t:"parole",l:"Ripasso parole"}]},
 {id:"u14",ph:"p3",lvl:"B1",title:"Hypothèses",can:"Fare ipotesi reali e irreali.",
  gram:"si + présent · si + imparfait · si + plus-que-parfait",
  spiega:"Tre schemi: si + presente → presente, futuro o imperativo (si tu veux, on ira); si + imparfait → conditionnel présent (si j'avais le temps, j'apprendrais); si + plus-que-parfait → conditionnel passé (si j'avais su, je serais venu). Dopo si non vanno mai il condizionale né il futuro.",
  ex:[["S'il pleut, nous resterons à la maison.","Se piove resteremo a casa."],["Si j'avais plus de temps, je ferais du sport.","Se avessi più tempo farei sport."],["Si le client valide, les travaux commenceront en mars.","Se il cliente approva, i lavori inizieranno a marzo."],["Que feriez-vous si vous gagniez au loto ?","Cosa fareste se vinceste alla lotteria?"]],
  trap:"«Se avessi» si dice si j'avais (imparfait), non con un congiuntivo.",
  quiz:[["Si j'___ le temps, je viendrais.",["avais","aurais","ai eu"]],["S'il fait beau demain, nous ___ à la plage.",["irons","irions","allions"]],["Si tu travaillais moins, tu ___ moins fatigué.",["serais","seras","étais"]],["Si vous avez des questions, ___-moi.",["appelez","appelleriez","appeliez"]],["Je ___ content s'il venait.",["serais","serai","étais"]]],
  acts:[{t:"orale",o:{id:"po14",lvl:"B1",prep:60,text:"Si vous pouviez changer une chose dans votre ville, que feriez-vous ? Expliquez pourquoi."},l:"Orale: un'ipotesi"},{t:"dialogo",lvl:"B1",l:"Ascolto B1"}]},
 {id:"u15",ph:"p3",lvl:"B1",title:"Discours rapporté",can:"Riferire ciò che altri hanno detto o chiesto.",
  gram:"discorso indiretto · concordanza dei tempi · domande indirette",
  spiega:"Per riferire: il dit que + frase. Se il verbo introduttivo è al passato, i tempi slittano: présent → imparfait, passé composé → plus-que-parfait, futur → conditionnel. Le domande indirette usano si, ce que, où, quand: il m'a demandé si j'étais libre.",
  ex:[["Le client a dit qu'il était satisfait.","Il cliente ha detto che era soddisfatto."],["Elle m'a expliqué qu'elle avait raté le train.","Mi ha spiegato che aveva perso il treno."],["Il a promis qu'il enverrait le devis.","Ha promesso che avrebbe mandato il preventivo."],["Je lui ai demandé ce qu'il voulait.","Gli ho chiesto cosa voleva."]],
  trap:"Il futuro nel passato è un condizionale presente (il enverrait), non passato come in italiano (avrebbe mandato).",
  quiz:[["Il a dit qu'il ___ fatigué.",["était","est","sera"]],["Elle m'a dit qu'elle ___ le dossier la veille.",["avait envoyé","envoie","enverra"]],["Ils ont annoncé qu'ils ___ en juin.",["viendraient","viendront","sont venus"]],["Il m'a demandé ___ je voulais.",["ce que","qu'est-ce que","que"]],["Je lui ai demandé ___ il était libre.",["s'","si que","est-ce qu'"]]],
  acts:[{t:"dialogo",lvl:"B1",l:"Ascolto: riunione"},{t:"parla",ctx:"lavoro",l:"Conversazione: riferire una riunione"}]},
 {id:"u16",ph:"p3",lvl:"B1",title:"Cause et conséquence",can:"Spiegare cause e conseguenze (descrittore DELF B2).",
  gram:"parce que, puisque, comme, grâce à, à cause de · donc, c'est pourquoi, par conséquent",
  spiega:"Causa: parce que (risponde a pourquoi), puisque (causa già nota), comme (a inizio frase), grâce à (causa positiva), à cause de (negativa), en raison de (formale). Conseguenza: donc, alors, c'est pourquoi, par conséquent, si bien que.",
  ex:[["Comme il pleuvait, le chantier a été suspendu.","Siccome pioveva, il cantiere è stato sospeso."],["Grâce à l'isolation, la facture a baissé de trente pour cent.","Grazie all'isolamento la bolletta è scesa del trenta per cento."],["Le délai était court, c'est pourquoi nous avons travaillé le samedi.","La scadenza era vicina, per questo abbiamo lavorato il sabato."],["Puisque tout le monde est là, commençons.","Visto che ci sono tutti, cominciamo."]],
  trap:"Car è solo scritto e mai a inizio frase; comme a inizio frase sostituisce parce que.",
  quiz:[["___ il était malade, il n'est pas venu.",["Comme","Parce que","Car"]],["Nous avons réussi ___ ton aide.",["grâce à","à cause de","parce que"]],["Le vol a été annulé ___ la neige.",["à cause de","grâce à","puisque"]],["Il est tard, ___ je rentre.",["donc","parce que","puisque"]],["Je ne viens pas ___ je suis fatigué.",["parce que","à cause de","grâce à"]]],
  acts:[{t:"scrivi",w:{id:"pw16",lvl:"B1",words:180,focus:"lettera",text:"Votre ville veut fermer une école de quartier. Écrivez au maire pour expliquer les conséquences de cette décision et proposer une solution (180 mots).",it:"Lettera al sindaco: cause e conseguenze."},l:"Scrivi al sindaco"},{t:"lettura",id:"r1",l:"Lettura B1"},{t:"orale",o:{id:"o1",lvl:"B1",prep:60,text:"Présentez-vous et parlez de votre travail : ce que vous faites, ce que vous aimez, ce que vous voudriez changer."},l:"Orale: parlare del lavoro"}]},

 {id:"u17",ph:"p4",lvl:"B2",title:"Concession et opposition",can:"Ammettere un argomento contrario senza cambiare posizione.",
  gram:"bien que + congiuntivo · malgré · même si · pourtant, cependant, toutefois · alors que",
  spiega:"Concessione = riconoscere un fatto senza cambiare conclusione. Bien que e quoique + congiuntivo; même si + indicativo; malgré + nome; pourtant, cependant, toutefois, néanmoins collegano due frasi; alors que e tandis que confrontano. La griglia orale del DELF B2 la chiede esplicitamente.",
  ex:[["Bien que le projet soit coûteux, il est nécessaire.","Benché il progetto sia costoso, è necessario."],["Malgré les difficultés, nous avons respecté les délais.","Nonostante le difficoltà abbiamo rispettato i tempi."],["Même si le loyer est élevé, le quartier vaut la peine.","Anche se l'affitto è alto, il quartiere vale la pena."],["Le télétravail est pratique ; toutefois, il peut isoler.","Il telelavoro è comodo; tuttavia può isolare."]],
  trap:"«Malgré que» è da evitare: si dice bien que + congiuntivo oppure malgré + nome.",
  quiz:[["___ il soit tard, nous continuons.",["Bien qu'","Même s'","Malgré qu'"]],["___ la pluie, ils sont sortis.",["Malgré","Bien que","Même si"]],["___ le loyer est cher, je le prends.",["Même si","Bien que","Malgré"]],["Il a beaucoup travaillé ; ___, il n'a pas réussi.",["pourtant","donc","car"]],["Elle aime la ville, ___ son mari préfère la campagne.",["alors que","puisque","donc"]]],
  acts:[{t:"dialogo",lvl:"B2",l:"Ascolto B2: il telelavoro"},{t:"orale",o:{id:"o3",lvl:"B2",prep:180,text:"« Le travail à distance isole les salariés. » Êtes-vous d'accord ? Justifiez votre position."},l:"Orale: difendere un'opinione"},{t:"parole",l:"Ripasso connettivi"}]},
 {id:"u18",ph:"p4",lvl:"B2",title:"Regrets et reproches",can:"Esprimere rimpianti, rimproveri, ipotesi sul passato.",
  gram:"conditionnel passé · si + plus-que-parfait · notizia non confermata",
  spiega:"Il conditionnel passé (j'aurais fait, je serais venu) esprime un rimpianto, un rimprovero (tu aurais dû...), l'ipotesi irreale nel passato (si j'avais su, j'aurais...) e, nei giornali, un'informazione non confermata (l'incendie aurait fait deux victimes).",
  ex:[["J'aurais dû vérifier les mesures.","Avrei dovuto verificare le misure."],["Si nous avions isolé la toiture, nous aurions économisé beaucoup.","Se avessimo isolato il tetto avremmo risparmiato molto."],["Vous auriez pu me prévenir !","Avrebbe potuto avvisarmi!"],["Selon la presse, le projet aurait coûté deux millions.","Secondo la stampa il progetto sarebbe costato due milioni."]],
  trap:"Nei notiziari radio (prova di ascolto) il condizionale segnala che l'informazione non è confermata.",
  quiz:[["Si j'avais su, je ___ plus tôt.",["serais venu","viendrais","suis venu"]],["Tu ___ me le dire !",["aurais pu","pourrais avoir","as pu avoir"]],["Si nous ___ plus tôt, nous aurions eu le train.",["étions partis","serions partis","partions"]],["Selon les médias, le ministre ___ démissionner.",["aurait décidé de","décidera de","décidait"]],["J'___ aimé vous rencontrer.",["aurais","avais","aurai"]]],
  acts:[{t:"dialogo",lvl:"B2",l:"Ascolto B2: reportage"},{t:"scrivi",w:{id:"pw18",lvl:"B2",words:200,focus:"bilancio",text:"Vous avez mené un projet qui ne s'est pas passé comme prévu. Écrivez un article pour le blog de votre entreprise : ce qui s'est passé, ce que vous auriez dû faire, ce que vous ferez la prochaine fois (200 mots).",it:"Bilancio di un progetto andato male."},l:"Scrivi un bilancio"}]},
 {id:"u19",ph:"p4",lvl:"B2",title:"Style formel",can:"Scrivere testi formali compatti e precisi.",
  gram:"forma passiva · nominalizzazione",
  spiega:"Passivo: être + participio, agente con par (le rapport a été rédigé par l'équipe). Nella lingua formale si trasforma spesso un verbo in nome: construire → la construction, réduire → la réduction, décider → la décision. Rende i testi più compatti: utile nella lettera formale e nell'articolo.",

const $=s=>document.querySelector(s);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’']/g," ").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function hashStr(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h);}
function lvlIdx(l){return Math.max(0,LEVELS.indexOf(l));}
function logDay(){const t=today();if(!S.log[t])S.log[t]={min:0,ext:0};return S.log[t];}
function markDone(k){const t=today();if(!S.doneToday[t])S.doneToday={[t]:{}};S.doneToday[t][k]=true;if(pathCtx){const pc=pathCtx;pathCtx=null;pState(pc.u).acts[pc.a]=true;checkUnitDone(unitById(pc.u));}save();}
function isDone(k){const t=today();return !!(S.doneToday[t]&&S.doneToday[t][k]);}
function pushSkill(sk,score,lvl){S.skills[sk].push({s:Math.round(score*100)/100,l:lvl,d:today()});if(S.skills[sk].length>40)S.skills[sk].shift();save();}
function skillLevel(sk){
  const arr=S.skills[sk]; let best=null;
  for(const L of LEVELS){const r=arr.filter(x=>x.l===L).slice(-5);if(r.length>=2&&r.reduce((a,b)=>a+b.s,0)/r.length>=0.7)best=L;}
  return best||S.profile.start;
}
function skillAvg(sk){const r=S.skills[sk].slice(-8);if(!r.length)return null;return r.reduce((a,b)=>a+b.s,0)/r.length;}
function overallLevel(){const ls=["co","ce","ee","eo"].map(skillLevel).map(lvlIdx);return LEVELS[Math.min(...ls)];}
function totalHours(){return Object.values(S.log).reduce((a,b)=>a+(b.min||0)+(b.ext||0),0)/60;}

let voices=[];
function loadVoices(){try{voices=window.speechSynthesis?speechSynthesis.getVoices():[];}catch(e){voices=[];}}
loadVoices(); try{if(window.speechSynthesis)speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}
function frVoices(){
  const pref=S.profile.variant==="qc"?"fr-ca":"fr-fr";
  let v=voices.filter(x=>(x.lang||"").toLowerCase().replace("_","-").startsWith(pref));
  if(!v.length)v=voices.filter(x=>(x.lang||"").toLowerCase().startsWith("fr"));
  return v;
}
let rate=0.9;
function hasVoice(){return (window.speechSynthesis&&typeof SpeechSynthesisUtterance!=="undefined")||!!tts;}
function stopSpeak(){try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){} try{if(tts)tts.stop();}catch(e){}}
function speak(lines,r){
  // lines: [{text, who}] ; who 0/1 per voce diversa. Tutte le frasi in coda subito, dentro il tocco dell'utente (necessario su iPhone).
  const rr=r||rate, synth=window.speechSynthesis;
  if(synth&&typeof SpeechSynthesisUtterance!=="undefined"){
    try{if(synth.speaking||synth.pending)synth.cancel();synth.resume();}catch(e){}
    loadVoices(); const fv=frVoices(); const lang=S.profile.variant==="qc"?"fr-CA":"fr-FR";
    return new Promise(res=>{
      lines.forEach((l,i)=>{
        const u=new SpeechSynthesisUtterance(l.text); u.lang=lang; u.rate=rr;
        if(fv.length)u.voice=fv[(l.who||0)%fv.length];
        if(fv.length<2&&l.who)u.pitch=0.85;
        if(i===lines.length-1){u.onend=()=>res();u.onerror=()=>res();}
        synth.speak(u);
      });
      if(!lines.length)res();
    });
  }
  if(tts){
    const vs=["airy","rounded"];
    return tts.speak(lines.map(l=>({text:l.text,voice:vs[(l.who||0)%2],language:"fr"})),{rate:Math.max(0.7,Math.min(1.5,rr))}).catch(()=>{});
  }
  return Promise.resolve();
}

const REC_OK=STANDALONE&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)&&typeof MediaRecorder!=="undefined";

function note(near,txt){const old=near.parentNode.querySelector(".rec-note");if(old)old.remove();const p=document.createElement("p");p.className="note rec-note";p.textContent=txt;near.parentNode.insertBefore(p,near.nextSibling);}
async function toggleRec(btn,onDone){
  if(rec){if(rec.btn===btn)rec.mr.stop();return;}
  stopSpeak();
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
  catch(e){note(btn,"Microfono non autorizzato. Su iPhone: Impostazioni › Safari › Microfono › Consenti, poi ricarica la pagina.");return;}
  const types=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg"];
  const mt=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";
  let mr; try{mr=new MediaRecorder(stream,mt?{mimeType:mt}:undefined);}catch(e){mr=new MediaRecorder(stream);}
  const chunks=[]; rec={mr,btn,t0:Date.now()};
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  mr.onstop=()=>{
    stream.getTracks().forEach(t=>t.stop());
    const blob=new Blob(chunks,{type:mr.mimeType||mt||"audio/webm"}); const dur=(Date.now()-rec.t0)/1000; rec=null;
    btn.classList.remove("red"); btn.innerHTML=ICON.mic+" Registra"; onDone(blob,dur);
  };
  mr.start(250); btn.classList.add("red"); btn.innerHTML=ICON.stop+" Stop";
}
async function transcribe(blob){
  if(!groqKey)throw {code:"no_key"};
  const ext=blob.type.includes("mp4")?"m4a":blob.type.includes("ogg")?"ogg":"webm";
  const fd=new FormData(); fd.append("file",blob,"voce."+ext); fd.append("model","whisper-large-v3"); fd.append("language","fr"); fd.append("response_format","verbose_json"); fd.append("temperature","0");
  let res;
  try{res=await fetch("https://api.groq.com/openai/v1/audio/transcriptions",{method:"POST",headers:{"Authorization":"Bearer "+groqKey},body:fd});}catch(e){throw {code:"network"};}
  if(res.status===429)throw {code:"rate_limited"}; if(res.status===401)throw {code:"bad_key"}; if(!res.ok)throw {code:"http"};
  const j=await res.json(); const segs=j.segments||[];
  const lp=segs.length?segs.reduce((a,x)=>a+(x.avg_logprob||0),0)/segs.length:null;
  let pauses=0; for(let i=1;i<segs.length;i++){if(segs[i].start-segs[i-1].end>0.8)pauses++;}
  return {text:(j.text||"").trim(),clarity:lp==null?null:Math.max(0,Math.min(1,1+lp)),duration:j.duration||null,pauses};
}

/* ============================ SRS ============================ */
function allWords(){
  const out=[];
  for(const ctx in VOCAB){VOCAB[ctx].split(";").forEach(e=>{const [fr,it,g]=e.split("|");out.push({id:ctx+":"+fr,fr,it,ctx,g:g||guessG(fr)});});}
  S.custom.forEach(w=>out.push(Object.assign({ctx:"mie"},w)));
  return out;
}
function guessG(fr){if(/^le /.test(fr))return "m";if(/^la /.test(fr))return "f";if(/^les /.test(fr))return "p";return "";}
function activeWords(){const cs=new Set(["base","esame",...S.profile.contexts,"mie"]);return allWords().filter(w=>cs.has(w.ctx));}
function dueWords(){const now=Date.now();return activeWords().filter(w=>S.srs[w.id]&&S.srs[w.id].due<=now);}
function newWords(n){return activeWords().filter(w=>!S.srs[w.id]).slice(0,n);}
function grade(w,q){ // q: 0 di nuovo,1 difficile,2 bene,3 facile
  const c=S.srs[w.id]||{ivl:0,ease:2.5,reps:0,lapses:0,due:0};
  if(q===0){c.reps=0;c.lapses++;c.ivl=0;c.ease=Math.max(1.3,c.ease-0.2);c.due=Date.now()+10*60000;}
  else{
    c.reps++;
    if(c.reps===1)c.ivl=q===3?4:1; else if(c.reps===2)c.ivl=q===1?3:6; else c.ivl=Math.round(c.ivl*(q===1?1.2:c.ease*(q===3?1.3:1)));
    c.ease=Math.max(1.3,c.ease+(q===1?-0.15:q===3?0.15:0));
    c.due=Date.now()+c.ivl*86400000;
  }
  S.srs[w.id]=c; save();
}
function knownCount(){return Object.values(S.srs).filter(c=>c.ivl>=7).length;}

function compare(target,said){
  const t=norm(target).split(" ").filter(Boolean), s=norm(said).split(" ").filter(Boolean);
  const pool={}; s.forEach(w=>pool[w]=(pool[w]||0)+1);
  let ok=0; const html=target.split(/\s+/).map(w=>{const n=norm(w);if(!n)return esc(w);const parts=n.split(" ");const hit=parts.every(p=>pool[p]>0);if(hit){parts.forEach(p=>pool[p]--);ok+=parts.length;return `<ins>${esc(w)}</ins>`;}return `<del>${esc(w)}</del>`;}).join(" ");
  return {score:t.length?Math.min(1,ok/t.length)*(s.length>t.length?Math.max(0.5,t.length/s.length):1):0,html};
}

let recog=null;
function startDict(btn,field){
  let base=field.value?field.value+" ":"";
  if(dictation){
    try{
      dictation.onPartial(({text})=>{field.value=base+text;});
      dictation.onFinal(({text})=>{base=base+text+" ";field.value=base;});
      dictation.onState(({state})=>{btn.textContent=state==="listening"?"Stop":"Detta";});
      if(btn.textContent==="Stop"){dictation.stop();return;}
      dictation.start().catch(()=>{btn.remove();});
    }catch(e){}
    return;
  }
  if(!SR)return;
  if(recog){try{recog.stop();}catch(e){} recog=null; btn.textContent="Detta"; return;}
  recog=new SR(); recog.lang=S.profile.variant==="qc"?"fr-CA":"fr-FR"; recog.interimResults=true; recog.continuous=true;
  recog.onresult=ev=>{let fin="",tmp="";for(let i=ev.resultIndex;i<ev.results.length;i++){const t=ev.results[i][0].transcript;if(ev.results[i].isFinal)fin+=t+" ";else tmp+=t;}base+=fin;field.value=base+tmp;field.dispatchEvent(new Event("input"));};
  recog.onend=()=>{recog=null;btn.textContent="Detta";};
  recog.onerror=e=>{recog=null;btn.textContent="Detta";if(e.error==="not-allowed")alertMsg(field,"Microfono non autorizzato: consentilo nelle impostazioni del browser.");};
  try{recog.start();btn.textContent="Stop";}catch(e){recog=null;}
}
function alertMsg(near,txt){const p=document.createElement("p");p.className="note";p.textContent=txt;near.parentNode.insertBefore(p,near.nextSibling);}

/* ============================ VERBI ============================ */
let vb=null;
function newVerbQ(){
  const names=Object.keys(VERBS); const v=names[Math.floor(Math.random()*names.length)];
  const ts=route.ten&&route.ten.length?route.ten:(lvlIdx(skillLevel("ee"))<1?["pres","pc"]:["pres","pc","imp","fut"]); const t=ts[Math.floor(Math.random()*ts.length)];
  const p=Math.floor(Math.random()*6); return {v,t,p,ans:conj(v,t,p)};
}
function conj(v,t,p){
  const V=VERBS[v];
  if(t==="pres")return [V.pres[p]];
  if(t==="imp"){const e=["ais","ais","ait","ions","iez","aient"][p];let st=V.imp;if(v==="être")st="ét";return [st+e];}
  if(t==="fut"){return [V.fut+["ai","as","a","ons","ez","ont"][p]];}
  const aux=V.aux==="être"?VERBS["être"].pres[p]:VERBS["avoir"].pres[p];
  if(V.aux==="être"){const pl=p>=3;return pl?[aux+" "+V.pp+"s",aux+" "+V.pp+"es",aux+" "+V.pp]:[aux+" "+V.pp,aux+" "+V.pp+"e"];}
  return [aux+" "+V.pp];
}

}

async function aiTurn(){
  ch.busy=true; render();
  const msgs=[{role:"user",content:chatInstr()+"\n\nCommence la conversation."}].concat(ch.msgs.length?[{role:"assistant",content:ch.msgs[0].content}]:[]).concat(ch.msgs.slice(1));
  try{
    const txt=await aiChat(msgs);
    ch.msgs.push({role:"assistant",content:txt.trim()});
    ch.busy=false; render(); speak([{text:txt,who:1}],rate);
  }catch(e){ch.busy=false;ch.msgs.push({role:"assistant",content:"("+aiErr(e)+")"});render();}
}

let pathCtx=null;
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtDate(d){return d.toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"});}
function unitById(id){return UNITS.find(u=>u.id===id);}
function unitData(u){
  if(!u.ex_unit)return u;
  const e=EXAM_UNITS[S.profile.exam==="tcf"?"tcf":"delf"][u.ex_unit];
  return Object.assign({},u,{spiega:e.spiega,tips:e.tips,quiz:e.quiz,acts:e.acts,gram:"Formato "+(S.profile.exam==="tcf"?"TCF Canada":"DELF B2"),ex:[],trap:""});
}
function pState(id){if(!S.path)S.path={};if(!S.path[id])S.path[id]={acts:{},quiz:null,done:null};return S.path[id];}
function unitDone(u){const p=S.path&&S.path[u.id];return !!(p&&p.done);}
function optionalUnit(u){return u.lvl!=="EX"&&lvlIdx(u.lvl)<lvlIdx(S.profile.start);}
function nextUnit(){return UNITS.find(u=>!unitDone(u)&&!optionalUnit(u))||null;}
function realActs(d){return d.acts.map((a,i)=>[a,i]).filter(([a])=>a.t!=="link");}
function actsDone(u){const d=unitData(u),p=pState(u.id);return realActs(d).filter(([a,i])=>p.acts[i]).length;}
function actsNeeded(u){return Math.max(1,Math.ceil(realActs(unitData(u)).length*0.6));}
function checkUnitDone(u){
  const p=pState(u.id);
  if(!p.done&&p.quiz!=null&&p.quiz>=0.8&&actsDone(u)>=actsNeeded(u)){p.done=today();save();return true;}
  return false;
}
function weeklyHours(){
  let m=0;for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()-i);const l=S.log[ymd(d)];if(l)m+=(l.min||0)+(l.ext||0);}
  const h=m/60; return h>=1?h/2:S.profile.daily*7/60;
}
function remainingHours(){return UNITS.filter(u=>!unitDone(u)&&!optionalUnit(u)).reduce((a,u)=>a+UNIT_HOURS[u.lvl],0);}
function pace(){
  const rem=remainingHours(), wk=Math.max(0.5,weeklyHours());
  const end=new Date(); end.setDate(end.getDate()+Math.ceil(rem/wk*7));
  const r={rem,wk,end};
  if(S.profile.date){
    const ex=new Date(S.profile.date); const days=Math.ceil((ex-new Date())/86400000)-14;
    r.exam=ex; r.late=end>new Date(ex.getTime()-14*86400000);
    r.needMin=days>0?Math.ceil(rem*60/days):null;
  }
  return r;
}
function unitSchedule(){
  // data prevista di fine per ogni unità, al ritmo attuale
  const wk=Math.max(0.5,weeklyHours()); let acc=0; const out={};
  UNITS.forEach(u=>{if(unitDone(u)||optionalUnit(u))return;acc+=UNIT_HOURS[u.lvl];const d=new Date();d.setDate(d.getDate()+Math.ceil(acc/wk*7));out[u.id]=d;});
  return out;
}
function launchAct(u,i){
  const a=unitData(u).acts[i]; pathCtx={u:u.id,a:i};
  if(a.t==="verbi"){vb={fresh:true};go("verbi",{ten:a.ten});return;}
  if(a.t==="suono"){go("suono",{id:a.id});return;}
  if(a.t==="lettura"){rd={};go("lettura",{id:a.id});return;}
  if(a.t==="parole"){rv=null;go("ripasso");return;}
  if(a.t==="dialogo"){
    const pool=DIALOGS.concat(S.gen).filter(d=>d.lvl===a.lvl);
    const pref=pool.filter(d=>S.profile.contexts.includes(d.ctx));
    const list=(pref.length?pref:pool); const fresh=list.filter(d=>!S.dialogs[d.id]);
    const d=(fresh.length?fresh:list)[0]||DIALOGS[0]; dl={}; go("dialogo",{id:d.id});return;
  }
  if(a.t==="scrivi"){
    if(a.w&&!WRITING.find(x=>x.id===a.w.id))WRITING.push(Object.assign({exam:"all"},a.w));
    wr={id:a.w?a.w.id:a.wid,text:"",t0:Date.now(),fb:null}; go("scrivi");return;
  }
  if(a.t==="orale"){
    if(!ORAL.find(x=>x.id===a.o.id))ORAL.push(a.o);
    orl={id:a.o.id,phase:"prep",t0:Date.now()}; go("orale");return;
  }
  if(a.t==="parla"){
    ch={ctx:a.ctx||S.profile.contexts[0]||"amici",scene:a.scene||null,msgs:[],busy:false,fb:null};
    go("parla"); if(aiOn())aiTurn(); return;
  }
}

    const txt=`Riepilogo Class 4 Me Français (${today()})
Esame: ${FORMATS[S.profile.exam].name}${S.profile.date?" il "+S.profile.date:""}. Variante: ${S.profile.variant==="qc"?"Québec":"Francia"}.
Livello di partenza ${S.profile.start}, stimato oggi ${overallLevel()}. Abilità: ${sk}.
Ore totali ${totalHours().toFixed(1)} su circa ${NEED_HOURS[S.profile.start]} stimate. Parole consolidate ${knownCount()}. Verbi ${S.verbs.ok}/${S.verbs.n}.
Contesti: ${S.profile.contexts.map(c=>CONTEXTS[c]).join(", ")}.
Proponi il piano del prossimo mese, insistendo sull'abilità più debole.`;
    copyText(txt,e.target);
  };
};
function viewImpostazioni(){
  ob={exam:S.profile.exam,variant:S.profile.variant,daily:S.profile.daily,contexts:S.profile.contexts.slice(),date:S.profile.date};
  return `<div class="stack"><button class="btn ghost small" data-go="io" style="align-self:flex-start">‹ Progressi</button><h1>Impostazioni</h1></div>
   <div class="card"><label for="s-exam">Esame</label><select id="s-exam"><option value="delf" ${S.profile.exam==="delf"?"selected":""}>DELF B2</option><option value="tcf" ${S.profile.exam==="tcf"?"selected":""}>TCF Canada / TEF Canada</option></select>
    <label for="s-date">Data dell'esame</label><input type="date" id="s-date" value="${esc(S.profile.date)}">
    <label for="s-var">Variante di francese</label><select id="s-var"><option value="fr" ${S.profile.variant==="fr"?"selected":""}>Francia</option><option value="qc" ${S.profile.variant==="qc"?"selected":""}>Québec</option></select>
    <label for="s-min">Minuti al giorno</label><input type="number" id="s-min" min="10" max="240" value="${S.profile.daily}">
    <label>Contesti</label><div class="chips">${Object.entries(CONTEXTS).map(([k,l])=>`<button class="toggle ${S.profile.contexts.includes(k)?"on":""}" data-sc="${k}">${l}</button>`).join("")}</div>
    <p class="small muted">Voci francesi trovate su questo dispositivo: ${frVoices().length}. ${dbRef?"Progressi salvati nel tuo profilo Claude.":"Progressi salvati solo su questo dispositivo."}</p>
    <button class="btn" id="s-save">Salva</button></div>
   <div class="card"><h3>Audio</h3><p class="small muted">Voci francesi sul dispositivo: ${frVoices().map(v=>esc(v.name)).join(", ")||"nessuna trovata"}.</p>
    <button class="btn soft small" id="s-audio">Prova l'audio</button>
    <p class="small muted">Se non senti nulla: su iPhone togli il silenzioso (interruttore laterale) e alza il volume; poi Impostazioni › Accessibilità › Contenuto letto ad alta voce › Voci › Français, scarica una voce e riapri l'app.</p></div>
   <div class="card"><h3>Intelligenza artificiale</h3>
    ${sample?`<p class="small">Dentro Claude l'app usa Claude per conversazioni e correzioni.</p>`:`<p class="small muted">Fuori da Claude, conversazioni, correzioni e valutazione della voce usano Groq con la tua chiave gratuita (console.groq.com › API Keys). La chiave resta solo su questo dispositivo.</p>
    <label for="s-key">Chiave API Groq</label><input type="text" id="s-key" value="${esc(groqKey)}" placeholder="gsk_..." autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="s-model">Modello</label><input type="text" id="s-model" value="${esc(groqModel)}" autocapitalize="off" spellcheck="false">
    <div class="row"><button class="btn small" id="s-key-save">Salva chiave</button><button class="btn soft small" id="s-key-test">Prova</button></div><p class="small" id="s-key-msg"></p>`}</div>
   <div class="card"><h3>Copia di sicurezza</h3><p class="small muted">I progressi sono salvati in questo browser. Esporta un file ogni tanto, e importalo per passare a un altro telefono.</p>
    <div class="row"><button class="btn soft small" id="s-exp">Esporta</button><label class="btn soft small" for="s-imp" style="cursor:pointer">Importa</label><input type="file" id="s-imp" accept="application/json" class="sr"></div><p class="small" id="s-bk-msg"></p></div>
   <div class="card"><h3>Versione</h3><p class="small">Versione installata: <b>${APP_VERSION}</b></p><button class="btn soft small" id="s-upd">Scarica l'ultima versione</button><p class="small" id="s-upd-msg"></p></div>
   <div class="card"><h3>Ripeti il test di livello</h3><button class="btn soft" id="s-test">Rifai il test</button></div>
   <div class="card"><h3>Azzera tutto</h3><p class="small muted">Cancella progressi, parole e impostazioni.</p><button class="btn red" id="s-reset">Azzera</button><div id="s-conf"></div></div>`;
}
binders.impostazioni=()=>{
  document.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{const k=b.dataset.sc;const c=S.profile.contexts;if(c.includes(k)){if(c.length>1)S.profile.contexts=c.filter(x=>x!==k);}else if(c.length<5)c.push(k);save();render();});
  $("#s-save").onclick=()=>{S.profile.exam=$("#s-exam").value;S.profile.date=$("#s-date").value;S.profile.variant=$("#s-var").value;S.profile.daily=Math.max(10,+$("#s-min").value||45);save();go("io");};
  $("#s-audio").onclick=()=>speak([{text:"Bonjour Mario, ceci est un test audio."}],0.9);
  const ks=$("#s-key-save"); if(ks)ks.onclick=()=>{groqKey=$("#s-key").value.trim();groqModel=$("#s-model").value.trim()||"openai/gpt-oss-120b";try{localStorage.setItem("c4m-groq",groqKey);localStorage.setItem("c4m-groq-model",groqModel);}catch(e){}$("#s-key-msg").textContent="Salvata.";};
  const kt=$("#s-key-test"); if(kt)kt.onclick=async()=>{groqKey=$("#s-key").value.trim();$("#s-key-msg").textContent="Provo...";try{const t=await aiChat([{role:"user",content:"Réponds seulement: Bonjour !"}]);$("#s-key-msg").textContent="Funziona: "+t.slice(0,40);}catch(e){$("#s-key-msg").textContent=aiErr(e);}};
  $("#s-exp").onclick=()=>{const data=JSON.stringify(S);const name="class4me-francais-"+today()+".json";
    try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();$("#s-bk-msg").textContent="File esportato: "+name;}
    catch(e){copyText(data,$("#s-exp"));}};
  $("#s-imp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{S=merge(JSON.parse(t));save();$("#s-bk-msg").textContent="Importato.";render();}).catch(()=>{$("#s-bk-msg").textContent="File non valido.";});};
  $("#s-upd").onclick=async()=>{$("#s-upd-msg").textContent="Aggiorno...";
    try{if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}
      if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}}catch(e){}
    location.replace(location.pathname+"?v="+Date.now());};
  $("#s-test").onclick=()=>{test={i:0,ok:{A1:0,A2:0,B1:0,B2:0}};go("test");};
  $("#s-reset").onclick=()=>{$("#s-conf").innerHTML=`<p class="small">Confermi? L'operazione non si annulla.</p><button class="btn red small" id="s-reset2">Sì, azzera</button>`;$("#s-reset2").onclick=()=>{S=defState();save();go("oggi");};};
};

$("#nav").addEventListener("click",()=>{pathCtx=null;},true);
render();
if(STANDALONE&&"serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});}
</script>
